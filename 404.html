<!DOCTYPE html>
<html lang="en">
<head>

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #04060e;
      color: #eaf0ff;

      text-transform: uppercase;

    }
    h1 {
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 16px;
    }
    p { color: #9aa7c7; margin-bottom: 36px; }
    a {
      display: inline-block;
      padding: 14px 30px;
      border-radius: 999px;
      text-decoration: none;
      color: #fff;
      font-weight: 600;
      font-size: 0.95rem;
      background: linear-gradient(135deg, #3b82f6, #7c3aed 60%, #a855f7);
      box-shadow: 0 8px 30px -8px rgba(99, 102, 241, 0.55);
      transition: transform 0.3s;
    }
    a:hover { transform: translateY(-2px); }
  </style>
</head>
